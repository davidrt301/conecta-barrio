<div class="card"
  [class.prioridad]="esPrioridad"
  (mouseleave)="resetScroll(card)"
  #card
>

  <div class="card-header">
    
      <span class="avatar">📝</span>
    
    <h3>{{ title }}</h3>
    <button
      class="btn-prioridad"
      type="button"
      (click)="alternarPrioridad()"
      [attr.aria-pressed]="esPrioridad"
    >
      {{ esPrioridad ? '⭐' : '☆' }}
    </button>
  </div>
  <div class="card-body">
    <p><span class="label">ID de Solicitud:</span> {{ id }}</p>
    <p><span class="label">ID de Usuario:</span> {{ userId }}</p>
    <p><span class="label">Descripción:</span> {{ body }}</p>
  </div>
</div>
